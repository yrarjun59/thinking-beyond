<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="title description">
  <title id="title">Thinking Beyond studio conversation</title>
  <desc id="description">A quiet animated line illustration of Manisha Neupane talking with five fictional guest personas.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5b59e"/><stop offset="1" stop-color="#a9816d"/></linearGradient>
  </defs>
  <style>
    .guest{opacity:0;animation:guest-slot 10s ease-in-out infinite}
    .guest-one{animation-delay:0s}.guest-two{animation-delay:-8s}.guest-three{animation-delay:-6s}.guest-four{animation-delay:-4s}.guest-five{animation-delay:-2s}
    @keyframes guest-slot{0%,100%{opacity:0}2%,18%{opacity:1}20%{opacity:0}}
    .guest-head{transform-box:fill-box;transform-origin:50% 85%;animation:head-nod 4.8s ease-in-out infinite}
    .host-head{transform-box:fill-box;transform-origin:50% 88%;animation:host-nod 5.4s ease-in-out infinite}
    .guest-hand,.host-hand{transform-box:fill-box;transform-origin:10% 10%;animation:talking-hand 3.8s ease-in-out infinite}
    .guest-eyes,.host-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.2s steps(1,end) infinite}
    @keyframes head-nod{0%,100%{transform:rotate(0)}48%{transform:rotate(-1.1deg)}56%{transform:rotate(0)}}
    @keyframes host-nod{0%,100%{transform:rotate(0)}46%{transform:rotate(1deg)}54%{transform:rotate(0)}}
    @keyframes talking-hand{0%,100%{transform:rotate(0)}45%{transform:rotate(-2.5deg)}56%{transform:rotate(0)}}
    @keyframes blink{0%,47%,52%,100%{transform:scaleY(1)}49%{transform:scaleY(.08)}}
    .scene-label,.host-label{font:700 12px Inter,Arial,sans-serif;letter-spacing:2px;fill:#f2f2f2}
    @media(prefers-reduced-motion:reduce){.guest{animation:none;opacity:0}.guest-one{opacity:1}.guest-head,.host-head,.guest-hand,.host-hand,.guest-eyes,.host-eyes{animation:none}}
  </style>
  <rect width="760" height="640" fill="url(#wall)"/>
  <path d="M52 505V263a328 328 0 0 1 656 0v242M91 480V276a289 289 0 0 1 578 0v204" fill="none" stroke="#222" stroke-width="1.5"/>
  <path d="M0 524h760" stroke="#292929"/>
  <g class="soundmark" fill="#c9c9c9"><rect x="350" y="114" width="2" height="13" rx="1"/><rect x="358" y="105" width="2" height="30" rx="1"/><rect x="366" y="111" width="2" height="18" rx="1"/><rect x="374" y="101" width="2" height="36" rx="1"/><rect x="382" y="111" width="2" height="18" rx="1"/><rect x="390" y="105" width="2" height="30" rx="1"/><rect x="398" y="114" width="2" height="13" rx="1"/></g>

  <!-- Guest one: relaxed blazer, curly silhouette, open-hand gesture. -->
  <g class="guest guest-one">
    <text class="scene-label" x="222" y="88" text-anchor="middle">ENTREPRENEUR</text>
    <path d="M103 572v-91c0-70 49-112 119-112s119 42 119 112v91z" fill="#303030" stroke="#888" stroke-width="2"/>
    <path d="m176 382 46 61 47-61" fill="none" stroke="#aaa" stroke-width="2"/>
    <path d="M196 320v52h52v-52" fill="url(#skin)"/>
    <path d="M166 230q-5-88 57-91 65-3 64 92l-8 53h-104z" fill="#171717"/>
    <g class="guest-head"><ellipse cx="222" cy="225" rx="48" ry="61" fill="url(#skin)"/>
      <path d="M174 217q-14-70 35-90 57-23 78 24l8 54q-21-12-33-38-33 35-83 35l-2 45z" fill="#171717"/>
      <path d="M187 174q-25-20-8-35m107 23q20-19 2-34" fill="none" stroke="#171717" stroke-width="13" stroke-linecap="round"/>
      <g class="guest-eyes"><path d="M202 225h1m40 0h1" stroke="#171717" stroke-width="5" stroke-linecap="round"/></g>
      <path d="M211 254q11 7 23 0" fill="none" stroke="#66463a" stroke-width="2" stroke-linecap="round"/></g>
    <g class="guest-hand"><path d="M272 423q30-9 47-25l20-23q7-7 11-2t-4 13l-11 12q17-12 23-7t-9 15q13-5 17 2t-12 14q-20 13-52 18z" fill="url(#skin)" stroke="#9b7764" stroke-width="1.5"/></g>
  </g>

  <!-- Guest two: tailored jacket, tie, and glasses. -->
  <g class="guest guest-two">
    <text class="scene-label" x="222" y="88" text-anchor="middle">BUSINESSPERSON</text>
    <path d="M103 572v-91c0-70 49-112 119-112s119 42 119 112v91z" fill="#2b2b2b" stroke="#888" stroke-width="2"/>
    <path d="m184 375 38 67 39-67m-39 67v112" fill="none" stroke="#bbb" stroke-width="2"/>
    <path d="M197 321v50h50v-50" fill="url(#skin)"/>
    <path d="M175 207q4-76 50-77 49 0 53 77v43H175z" fill="#171717"/>
    <g class="guest-head"><ellipse cx="222" cy="225" rx="45" ry="58" fill="url(#skin)"/>
      <path d="M177 205q3-75 51-75 43 0 50 63-22-5-49-32-20 25-51 34z" fill="#171717"/>
      <g fill="none" stroke="#e0e0e0" stroke-width="2"><rect x="186" y="215" width="29" height="19" rx="8"/><rect x="229" y="215" width="29" height="19" rx="8"/><path d="M215 222h14"/></g>
      <g class="guest-eyes"><path d="M199 225h1m43 0h1" stroke="#171717" stroke-width="4" stroke-linecap="round"/></g>
      <path d="M211 253q11 6 23 0" fill="none" stroke="#66463a" stroke-width="2" stroke-linecap="round"/></g>
    <g class="guest-hand"><path d="M273 421q28-7 45-21l21-22q7-6 11-1t-4 12l-12 12q18-11 23-6t-10 14q13-4 17 3t-12 13q-20 12-52 15z" fill="url(#skin)" stroke="#9b7764" stroke-width="1.5"/></g>
  </g>

  <!-- Guest three: casual top and headphones. -->
  <g class="guest guest-three">
    <text class="scene-label" x="222" y="88" text-anchor="middle">CONTENT CREATOR</text>
    <path d="M103 572v-91c0-70 49-112 119-112s119 42 119 112v91z" fill="#383838" stroke="#999" stroke-width="2"/>
    <path d="m176 382 46 61 47-61" fill="none" stroke="#aaa" stroke-width="2"/>
    <path d="M196 320v52h52v-52" fill="url(#skin)"/>
    <g class="guest-head"><ellipse cx="222" cy="225" rx="47" ry="59" fill="url(#skin)"/>
      <path d="M175 220q-9-71 42-88 49-16 70 31l-2 55q-22-9-32-41-29 29-78 29z" fill="#171717"/>
      <path d="M177 215q-14 2-14 19v14q0 11 12 11m92-44q14 2 14 19v14q0 11-12 11" fill="none" stroke="#d7d7d7" stroke-width="4"/>
      <g class="guest-eyes"><path d="M202 225h1m40 0h1" stroke="#171717" stroke-width="5" stroke-linecap="round"/></g>
      <path d="M211 254q11 7 23 0" fill="none" stroke="#66463a" stroke-width="2" stroke-linecap="round"/></g>
    <path d="M178 301q44 17 88 0" fill="none" stroke="#aaa" stroke-width="5"/>
    <g class="guest-hand"><path d="M273 423q30-9 47-25l20-23q7-7 11-2t-4 13l-11 12q17-12 23-7t-9 15q13-5 17 2t-12 14q-20 13-52 18z" fill="url(#skin)" stroke="#9b7764" stroke-width="1.5"/></g>
  </g>

  <!-- Guest four: long hair, round glasses, quiet sweater. -->
  <g class="guest guest-four">
    <text class="scene-label" x="222" y="88" text-anchor="middle">PHILOSOPHER</text>
    <path d="M103 572v-91c0-70 49-112 119-112s119 42 119 112v91z" fill="#303030" stroke="#888" stroke-width="2"/>
    <path d="M165 399q57 27 114 0" fill="none" stroke="#aaa" stroke-width="2"/>
    <path d="M196 320v52h50v-52" fill="url(#skin)"/>
    <path d="M169 230q-7-91 54-92 61-1 63 93v73h-117z" fill="#171717"/>
    <g class="guest-head"><ellipse cx="222" cy="225" rx="45" ry="58" fill="url(#skin)"/>
      <path d="M177 211q1-78 52-79 49 0 56 61-20-6-32-31-28 29-74 32v66h-2z" fill="#171717"/>
      <g fill="none" stroke="#dedede" stroke-width="2"><circle cx="204" cy="225" r="15"/><circle cx="242" cy="225" r="15"/><path d="M219 222h8"/></g>
      <g class="guest-eyes"><path d="M203 225h1m37 0h1" stroke="#171717" stroke-width="4" stroke-linecap="round"/></g>
      <path d="M211 253q11 6 23 0" fill="none" stroke="#66463a" stroke-width="2" stroke-linecap="round"/></g>
    <g class="guest-hand"><path d="M273 423q30-9 47-25l20-23q7-7 11-2t-4 13l-11 12q17-12 23-7t-9 15q13-5 17 2t-12 14q-20 13-52 18z" fill="url(#skin)" stroke="#9b7764" stroke-width="1.5"/></g>
  </g>

  <!-- Guest five: glasses, bun, and collared blouse. -->
  <g class="guest guest-five">
    <text class="scene-label" x="222" y="88" text-anchor="middle">SOCIOLOGIST</text>
    <path d="M103 572v-91c0-70 49-112 119-112s119 42 119 112v91z" fill="#303030" stroke="#999" stroke-width="2"/>
    <path d="m176 382 46 61 47-61" fill="none" stroke="#bbb" stroke-width="2"/>
    <path d="M196 320v52h52v-52" fill="url(#skin)"/>
    <g class="guest-head"><ellipse cx="222" cy="225" rx="46" ry="58" fill="url(#skin)"/>
      <path d="M176 218q-10-73 41-87 49-14 69 30l-3 53q-22-10-32-43-28 31-75 28z" fill="#171717"/><circle cx="267" cy="150" r="18" fill="#171717"/>
      <g fill="none" stroke="#e0e0e0" stroke-width="2"><rect x="185" y="215" width="30" height="20" rx="9"/><rect x="229" y="215" width="30" height="20" rx="9"/><path d="M215 222h14"/></g>
      <g class="guest-eyes"><path d="M199 225h1m43 0h1" stroke="#171717" stroke-width="4" stroke-linecap="round"/></g>
      <path d="M211 253q11 6 23 0" fill="none" stroke="#66463a" stroke-width="2" stroke-linecap="round"/></g>
    <g class="guest-hand"><path d="M273 423q30-9 47-25l20-23q7-7 11-2t-4 13l-11 12q17-12 23-7t-9 15q13-5 17 2t-12 14q-20 13-52 18z" fill="url(#skin)" stroke="#9b7764" stroke-width="1.5"/></g>
  </g>

  <!-- The host stays fixed while guest roles rotate. -->
  <path d="M404 572v-91c0-70 49-112 119-112s119 42 119 112v91z" fill="#292929" stroke="#888" stroke-width="2"/>
  <path d="m468 382 55 61 56-61" fill="none" stroke="#aaa" stroke-width="2"/>
  <path d="M496 320v53h53v-53" fill="url(#skin)"/>
  <path d="M478 205q-8-63 31-77 46-17 64 25 9 22 1 55l-3 72q-11 13-25 15l-4-56-3-38q-24-17-51 1l-3 88q-11-4-18-15l-1-70z" fill="#171717"/>
  <g class="host-head"><ellipse cx="523" cy="225" rx="48" ry="61" fill="url(#skin)"/>
    <path d="M475 211q1-73 54-78 50-5 59 57-22-7-51-34-20 33-60 39v68h-2z" fill="#171717"/>
    <g class="host-eyes"><path d="M500 225h1m43 0h1" stroke="#171717" stroke-width="5" stroke-linecap="round"/></g>
    <path d="M511 255q12 7 25 0" fill="none" stroke="#66463a" stroke-width="2" stroke-linecap="round"/></g>
  <g class="host-hand"><path d="M456 422q-25-16-40-32l-21-23q-7-7-11-2t4 13l12 12q-18-11-23-5t10 14q-13-4-17 3t12 13q21 13 54 16z" fill="url(#skin)" stroke="#9b7764" stroke-width="1.5"/></g>
  <text class="host-label" x="523" y="88" text-anchor="middle">MANISHA NEUPANE</text>

  <g fill="none" stroke="#bcbcbc" stroke-width="2"><path d="M41 355h114l43 50"/><path d="M719 355H605l-42 50"/><rect x="189" y="396" width="17" height="32" rx="8" fill="#333"/><rect x="554" y="396" width="17" height="32" rx="8" fill="#333"/></g>
  <path d="M301 495h154l35 36H267z" fill="#161616" stroke="#555" stroke-width="1.5"/><path d="M282 530v43m193-43v43" stroke="#494949" stroke-width="3"/>
  <path d="M350 480q18-19 36 0v14h-36z" fill="#bdbdbd"/><path d="M346 494h44" stroke="#ededed" stroke-width="2"/>
</svg>
