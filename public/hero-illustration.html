<style>
  /* Square hero canvas holding the complete, undistorted studio composition. */
  :root {
    --bg: #0b0908;
    --panel: #15110f;
    --line: #2b221d;
    --fg: #f4ede4;
    --muted: #a89b8e;
    --amber: #ffb454;
    --lime: #c6f432;
    --font-display: "Outfit", "Segoe UI", system-ui, sans-serif;
    --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { width: 100%; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; }

  .stage {
    position: relative;
    aspect-ratio: 1 / 1;
    width: 100%;
    max-width: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: #0c0a09;
    box-shadow: 0 30px 80px rgba(255, 150, 40, .12), 0 0 0 1px var(--line);
  }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .caption {
    position: absolute; left: 3.2%; bottom: 16%;
    width: min(40%, 420px);
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px 14px 12px;
    background: linear-gradient(90deg, rgba(8, 6, 5, .9), rgba(8, 6, 5, .72));
    border-left: 3px solid var(--lime);
    border-radius: 3px;
    transition: opacity .45s ease, transform .6s cubic-bezier(.2,.7,.2,1);
    min-height: 3.4em;
  }
  .caption.is-host {
    left: auto; right: 3.2%;
    border-left: 0; border-right: 3px solid var(--amber);
    background: linear-gradient(270deg, rgba(8, 6, 5, .9), rgba(8, 6, 5, .72));
    text-align: right;
  }
  .caption[hidden] { display: none !important; }
  .caption.is-off { opacity: 0; transform: translateY(8px); }
  .caption:not(.is-off) { opacity: 1; transform: translateY(0); }
  .caption .who {
    font: 700 clamp(9px, 1.15vw, 12px)/1 var(--font-body);
    letter-spacing: .14em; text-transform: uppercase; color: var(--lime);
  }
  .caption.is-host .who { color: var(--amber); }
  .caption .line {
    font: 500 clamp(10px, 1.25vw, 17px)/1.35 var(--font-display);
    color: #fff; text-wrap: balance;
  }
  .person-tag {
    position: absolute; z-index: 3; top: 31%;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    width: min(36%, 240px); padding: 8px 10px 9px;
    transform: translateX(-50%);
    color: #fff; text-align: center;
    background: rgba(5, 5, 5, .84);
    border: 1px solid rgba(255,255,255,.28);
    border-top: 2px solid var(--lime);
    box-shadow: 0 5px 18px rgba(0,0,0,.48);
    text-shadow: 0 1px 6px #000;
    pointer-events: none;
  }
  .person-tag.host { left: 82%; border-top-color: var(--amber); }
  .person-tag.guest { left: 18%; }
  .person-tag span { color: #c6c0b8; font: 700 clamp(7px,.7vw,9px)/1.15 var(--font-body); letter-spacing: .15em; text-transform: uppercase; }
  .person-tag strong { font: 700 clamp(9px,.95vw,13px)/1.15 var(--font-display); letter-spacing: .07em; text-transform: uppercase; }
  .stage.clean .caption { display: none; }

  body.embed { width:100%; height:100vh; padding:0; overflow:hidden; }
  body.embed .wrap { width:100%; max-width:none; height:100%; margin:0; display:grid; place-items:center; }
  body.embed header, body.embed #status { display:none; }
  body.embed .stage { width:100%; max-width:none; height:100%; aspect-ratio:auto; border-radius:0; box-shadow:none; }
  body.embed .caption { display:none !important; }
  body.embed .person-tag { top:31%; }
  @media (max-width:520px) {
    .caption { bottom:16%; width:42%; padding:6px 8px 7px; gap:3px; }
    .caption .who { font-size:7px; }
    .caption .line { font-size:clamp(8px,2.2vw,11px); }
    .person-tag { top:31%; width:36%; padding:5px 6px; gap:3px; }
    .person-tag span { font-size:6px; letter-spacing:.11em; }
    .person-tag strong { font-size:clamp(7px,2vw,9px); letter-spacing:.04em; overflow-wrap:anywhere; }
  }

</style>

<script>
if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
(() => {
  /* ---------- helpers ---------- */
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const sm = (x, a, b) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
  const lerp = (a, b, k) => a + (b - a) * k;
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
    r = Math.round(r + (f - r) * p); g = Math.round(g + (f - g) * p); b = Math.round(b + (f - b) * p);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }

  /* ---------- content: edit these ---------- */
  const HOST_NAME = 'Manisha Neupane';
  const GUESTS = [
    { role: 'Business leader', q: 'What does it take to build something that lasts?', a: 'Patience, and the courage to question your own assumptions.',
      skin: '#c68a5c', hair: '#1f1410', style: 'quiff', beard: 'full', glasses: true, top: '#3b302c', outfit: 'suit', shirt: '#efe6d6', pocket: '#c6f432', pants: '#2f2623', shoes: '#15110f' },

      case 'fleece':
        return `<path d="M -22 316 L 22 316 L 18 336 L -18 336 Z" fill="${c.plaid}"/><path d="M 0 332 L 0 472" stroke="${shade(c.top, .18)}" stroke-width="2.5"/><rect x="-44" y="410" width="30" height="5" rx="2" fill="${shade(c.top, .14)}"/><rect x="14" y="410" width="30" height="5" rx="2" fill="${shade(c.top, .14)}"/>`;
      case 'jacket':
        return `<path d="M -18 316 L 18 316 L 24 472 L -24 472 Z" fill="${c.tee}"/><path d="M -14 322 Q 0 356 14 322" fill="none" stroke="#e6c56a" stroke-width="1.6"/><circle cx="0" cy="352" r="3" fill="#e6c56a"/>`;
      default:
        return `<path d="M -22 316 Q 0 336 22 316 L 18 313 Q 0 326 -18 313 Z" fill="${shade(c.top, .1)}"/>`;
    }
  }
  function figure(c) {
    const S = c.skin, sleeve = c.top, fore = c.skinArms ? S : sleeve;
    const pd = shade(c.pants, -.3), hp = hairParts(c), hb = shade(c.hair, -.15);
    return `
    <g class="legs">
      <path d="M 6 480 L 98 494 L 104 566" fill="none" stroke="${pd}" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="118" cy="574" rx="26" ry="11" fill="${shade(c.shoes, -.25)}"/>
      <path d="M 6 470 L 122 476 L 130 556" fill="none" stroke="${c.pants}" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="146" cy="568" rx="28" ry="12" fill="${c.shoes}"/>
    </g>
    <g class="upper">
      <rect x="-56" y="452" width="118" height="38" rx="16" fill="${c.pants}"/>
      <rect x="-10" y="296" width="20" height="36" fill="${shade(S, -.12)}"/>
      <path d="M -56 346 C -56 324 -42 318 -20 316 L 20 316 C 42 318 56 324 56 346 L 58 472 L -58 472 Z" fill="${c.top}"/>
      ${extras(c)}
      <path d="M -42 344 Q -68 394 -62 422 L -22 458" fill="none" stroke="${sleeve}" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-16" cy="462" r="11" fill="${S}"/>
      <g class="head" transform="translate(6 270)">
        ${hp.back}
        <ellipse cx="-33" cy="6" rx="6" ry="9" fill="${S}"/>
        <ellipse cx="0" cy="0" rx="34" ry="40" fill="${S}"/>
        <path d="M 31 0 Q 42 10 31 15" fill="none" stroke="${shade(S, -.22)}" stroke-width="2.4" stroke-linecap="round"/>
        ${beardSvg(c)}
        <ellipse class="mouth" cx="17" cy="24" rx="8" ry="2" fill="#4b1d1b"/>
        <ellipse class="eye" cx="4" cy="-4" rx="3.3" ry="4.2" fill="#1a1210"/>
        <ellipse class="eye" cx="22" cy="-4" rx="3.3" ry="4.2" fill="#1a1210"/>
        <path d="M -4 -15 Q 4 -19 11 -16 M 14 -16 Q 22 -19 29 -15" fill="none" stroke="${hb}" stroke-width="3" stroke-linecap="round"/>
        ${c.glasses ? `<g fill="none" stroke="#14110f" stroke-width="2.6"><circle cx="4" cy="-4" r="8.5"/><circle cx="22" cy="-4" r="8.5"/><path d="M 12.5 -4 L 13.5 -4"/><path d="M -4.5 -5 L -33 -2"/></g>` : ''}
        ${hp.front}
        ${c.earring ? `<circle cx="-33" cy="18" r="3.2" fill="#e8c36a"/>` : ''}
      </g>
      <path d="M 40 344 Q 68 380 80 410" fill="none" stroke="${sleeve}" stroke-width="24" stroke-linecap="round"/>
      <g class="fore">
        <path d="M 80 410 L 146 410" fill="none" stroke="${fore}" stroke-width="22" stroke-linecap="round"/>
        <circle cx="154" cy="410" r="11" fill="${S}"/>
      </g>
    </g>`;
  }
  function chair() {
    return `
      <rect x="-165" y="326" width="330" height="190" rx="46" fill="#2b2522"/>
      <rect x="-165" y="326" width="330" height="26" rx="13" fill="#3a322e" opacity=".7"/>
      <rect x="-150" y="468" width="300" height="56" rx="22" fill="#352e2a"/>
      <rect x="-176" y="400" width="64" height="150" rx="30" fill="#2f2825"/>
      <rect x="112" y="400" width="64" height="150" rx="30" fill="#2f2825"/>
      <rect x="-150" y="548" width="18" height="38" rx="4" fill="#6a4630"/><rect x="132" y="548" width="18" height="38" rx="4" fill="#6a4630"/>
      <g transform="translate(-122 394) rotate(-8)">
        <rect x="-30" y="-30" width="60" height="60" rx="8" fill="#2e2927" stroke="#c6f432" stroke-width="2"/>
        <g fill="#8d8279"><circle cx="-12" cy="-12" r="2.5"/><circle cx="12" cy="-12" r="2.5"/><circle cx="0" cy="0" r="2.5"/><circle cx="-12" cy="12" r="2.5"/><circle cx="12" cy="12" r="2.5"/></g>
      </g>`;
  }

  /* ---------- build the scene ---------- */
  const $ = id => document.getElementById(id);
  $('chairL').innerHTML = chair();
  $('chairR').innerHTML = chair();

  const ref = root => ({
    root,
    upper: root.querySelector('.upper'),
    head: root.querySelector('.head'),
    mouth: root.querySelector('.mouth'),
    eyes: [...root.querySelectorAll('.eye')],
    fore: root.querySelector('.fore')
  });

  const guestRefs = GUESTS.map(g => {
    const w = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    w.setAttribute('display', 'none');
    w.innerHTML = figure(g);
    $('guestLayer').appendChild(w);
    return ref(w);
  });
  const hostWrap = $('hostLayer');
  hostWrap.innerHTML = figure(HOST);
  const hostRef = ref(hostWrap);

  // palm fronds
  const fronds = [];
  [-76, -54, -32, -10, 12, 34, 56, 78].forEach((a, i) => {
    const len = 170 + ((i * 37) % 60);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.innerHTML = `<path d="M 0 0 Q 17 ${-len * .45} 0 ${-len} Q -17 ${-len * .45} 0 0 Z" fill="url(#frondG)"/><path d="M 0 0 L 0 ${-len * .92}" stroke="#2f5d1b" stroke-width="1.5" opacity=".6"/>`;
    $('palm').appendChild(g);
    fronds.push({ g, a, i });
  });

  // wave bars
  const BARS = 5;
  function makeBars(layer, cx) {
    const out = [];
    for (let i = 0; i < BARS; i++) {
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', cx + (i - 2) * 10 - 3); r.setAttribute('width', 6); r.setAttribute('rx', 3);
      layer.appendChild(r); out.push(r);
    }
    return out;
  }
  const barsG = [makeBars($('waveG'), 452), makeBars($('waveGc'), 452)];
  const barsH = [makeBars($('waveH'), 828), makeBars($('waveHc'), 828)];


  /* ---------- animation ---------- */
  function updateFigure(r, o) {
    const { t, speak, gest, listen, seed, restAngle } = o;
    const breath = Math.sin(t * 1.8 + seed) * 1.2;
    r.upper.setAttribute('transform', `translate(0 ${breath.toFixed(2)})`);

    let rot = Math.sin(t * 1.3 + seed) * 1.0;
    rot += speak * Math.sin(t * 5.2 + seed) * 1.8;
    rot += listen * 3 * Math.pow(Math.max(0, Math.sin(t * 1.7 + seed)), 2);
    r.head.setAttribute('transform', `translate(6 270) rotate(${rot.toFixed(2)} -6 40)`);

    const syllable = Math.abs(Math.sin(t * 7.2 + seed) * Math.cos(t * 2.65 + seed * .4));
    const open = speak * (0.22 + 0.58 * syllable);
    r.mouth.setAttribute('ry', (1.7 + open * 6.5).toFixed(2));
    r.mouth.setAttribute('rx', (8 - open * 1.6).toFixed(2));

    const bt = (t + seed * 3) % 3.6;
    const blink = bt < 0.15 ? Math.sin(bt / 0.15 * Math.PI) : 0;
    const ry = (4.2 * (1 - blink) + 0.4).toFixed(2);
    r.eyes.forEach(e => e.setAttribute('ry', ry));

    const gesture = Math.sin(t * 2.05 + seed) * 15 + Math.sin(t * .92 + seed * .6) * 6;
    const swing = -30 + gesture;
    const ang = lerp(restAngle, swing, gest);
    r.fore.setAttribute('transform', `rotate(${ang.toFixed(1)} 80 410)`);
  }

  function updateBars(sets, amt, t, seed) {
    sets.forEach(layer => {
      layer.forEach((r, i) => {
        const h = 3 + amt * (5 + 18 * Math.abs(Math.sin(t * 5.4 + i * .9 + seed)));
        r.setAttribute('height', h.toFixed(1));
        r.setAttribute('y', (340 - h / 2).toFixed(1));
      });
    });
    sets[0][0].parentNode.setAttribute('opacity', amt.toFixed(2));
    sets[1][0].parentNode.setAttribute('opacity', amt.toFixed(2));
  }

  const logo = $('logo'), guestCaption = $('guestCaption'), guestCapWho = $('capWho'), guestCapLine = $('capLine');
  const hostCaption = $('hostCaption'), hostCapWho = $('hostCapWho'), hostCapLine = $('hostCapLine'), guestRole = $('guestRole');
  const leds = [...document.querySelectorAll('.led'), $('ledTop')];
  let shown = -1, t = 3.2, last = performance.now();

  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function render(t) {
    const idx = Math.floor(t / DUR) % GUESTS.length;
    const L = t % DUR;
    const g = GUESTS[idx];

    if (idx !== shown) {
      guestRefs.forEach((r, i) => r.root.setAttribute('display', i === idx ? 'inline' : 'none'));
      guestRole.textContent = g.role;
      shown = idx;
    }

    // phases: enter 0-.8 | host asks .9-2.7 | guest answers 2.8-6.9 | exit 7.1-8
    const enter = sm(L, 0, 0.8), exit = sm(L, 7.1, 8);
    const present = enter * (1 - exit);
    const travel = sm(L, 0, .82) * (1 - sm(L, 7.08, 8));
    const dx = -260 * (1 - travel);
    const hostSpeak = sm(L, 0.9, 1.1) * (1 - sm(L, 2.6, 2.8));
    const guestSpeak = sm(L, 2.8, 3.0) * (1 - sm(L, 6.8, 7.0));

    const gr = guestRefs[idx];
    gr.root.setAttribute('transform', `translate(${(330 + dx).toFixed(1)} 0)`);
    gr.root.setAttribute('opacity', present.toFixed(2));

    updateFigure(gr, { t, speak: guestSpeak, gest: guestSpeak, listen: hostSpeak * 0.6, seed: idx * 1.7, restAngle: 130 });
    updateFigure(hostRef, { t, speak: hostSpeak, gest: hostSpeak * 0.7, listen: guestSpeak, seed: 0.5, restAngle: 130 });

    updateBars(barsG, guestSpeak, t, 0);
    updateBars(barsH, hostSpeak, t, 2);

    // ambient motion
    fronds.forEach(f => f.g.setAttribute('transform', `rotate(${(f.a + Math.sin(t * 0.8 + f.i) * 1.8).toFixed(2)})`));
    const s = 1 + 0.012 * Math.sin(t * 1.5);
    logo.setAttribute('transform', `translate(640 204) scale(${s.toFixed(4)}) translate(-640 -204)`);
    const led = 0.82 + 0.18 * Math.sin(t * 1.1);
    leds.forEach(e => e.setAttribute('opacity', led.toFixed(2)));

    // captions
    let who = '', line = '', host = false, prog = 0;
    if (L >= 0.9 && L < 2.75) {
      host = true; who = `${HOST_NAME} · Host`; line = g.q; prog = (L - 0.9) / 1.4;
    } else if (L >= 2.75 && L < 7.3) {
      who = `Guest · ${g.role}`; line = g.a; prog = (L - 2.8) / 3.4;
    }
    guestCaption.classList.add('is-off');
    hostCaption.classList.add('is-off');
    if (who) {
      const activeCaption = host ? hostCaption : guestCaption;
      const activeWho = host ? hostCapWho : guestCapWho;
      const activeLine = host ? hostCapLine : guestCapLine;
      activeWho.textContent = who;
      activeLine.textContent = reduced ? line : line.slice(0, Math.ceil(line.length * clamp(prog)));
      activeCaption.classList.remove('is-off');
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!document.hidden && !reduced) t += dt;
    render(t);
    if (!reduced) requestAnimationFrame(frame);
  }
  render(t);
  if (!reduced) requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
})();
</script>

</body></html>
